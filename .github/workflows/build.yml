name: Build portable release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run package
      - name: Publish portable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $exe = "release/NexusPVE-1.0.0-portable.exe"
          if (-not (Test-Path $exe)) { throw "portable EXE was not produced" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NexusPVE-1.0.0-portable.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          gh release upload v1.0.0 $exe SHA256SUMS.txt -R $repo --clobber
          gh release edit v1.0.0 -R $repo --draft=false --latest --notes "Portable Windows x64 build of Nexus PVE 1.0.0.`n`nSHA-256: $hash"
          gh release view v1.0.0 -R $repo --json isDraft,url,assets --jq '{isDraft,url,assets:[.assets[]|{name,size,state,digest}]}'
