name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    name: Portable Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match package version to the tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build the portable EXE
        run: npm run package

      - name: Attach the EXE to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/NexusPVE-*-portable.exe
          fail_on_unmatched_files: true
